
name: gowdaegg_backend_app

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gowdaegg_app
    restart: always
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=gowda_egg_db
      - JWT_SECRET=gowda-egg-distributors-secret-key-2024
      - CORS_ORIGINS=*
      - DEBUG=FALSE
    ports:
      - "8956:8956"
    depends_on:
      - mongo
    volumes:
      - ./:/app
      - ./uploads:/uploads
      - ./processed_files:/processed_files
    command: uvicorn server:app --host 0.0.0.0 --port 8956 --reload

  mongo:
    image: mongo:4.4
    container_name: gowdaegg_mongo_db
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: